<section class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Sign in to continue to your document workspace.</p>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="auth-form">
      <label for="login-username">Username</label>
      <input
        id="login-username"
        type="text"
        formControlName="username"
        placeholder="Enter your username"
      />

      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        placeholder="Enter your password"
      />

      <button type="submit" [disabled]="loginForm.invalid">Login</button>

      <p
        *ngIf="loginMessage"
        class="auth-message"
        [class.success-message]="loginMessageType === 'success'"
        [class.error-message]="loginMessageType === 'error'"
      >
        {{ loginMessage }}
      </p>
    </form>
  </div>
</section>
